version: '3.8'

services:
  web:
    build: .                # usa Dockerfile
    ports:
      - "8080:80"           # localhost:8080 → contenedor:80
    volumes:
      - .:/var/www/html     # hot‑reload opcional
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dm_motors
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
